{% extends 'base.html' %} {% load static %} {% block content %}
<section class="section-intro padding-y-sm">
  <div class="container">
    <div class="intro-banner-wrap">
      <img
        src="{% static 'images/banners/1.jpg' %}"
        class="img-fluid rounded"
      />
    </div>
  </div>
</section>

<!-- ========================= SECTION  ========================= -->
<section class="section-name padding-y-sm">
  <div class="container">
    <header class="section-heading">
      <a href="{% url 'store' %}" class="btn btn-outline-primary float-right"
        >See all</a
      >

      <form method="get" action="">
        <input
          type="number"
          name="limit"
          placeholder="Барааны тоо бичнэ үү"
          min="1"
          class="form-control d-inline w-auto"
          value="{{request.GET.limit}}"
        />
        <button type="submit" class="btn btn-primary">Харах</button>
      </form>
      <h3 class="section-title">Сүүлд нэмэгдсэн бараа {{products_count}}</h3>
    </header>

    <div class="row">
      {% for i in products %}
      <div class="col-md-3">
        <div class="card card-product-grid">
          <a href="{% url 'product-detail' %}">
            <img
              src="/photos/{{ i.images }}"
              alt="{{ i.bname }}"
              style="height: 150px; width: auto"
            />
          </a>
          <figcaption class="info-wrap">
            <a href="{% url 'product-detail' %}" class="title">
              {{ i.bname }}
            </a>
            <div class="price mt-1">{{ i.price }}₮</div>
          </figcaption>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
